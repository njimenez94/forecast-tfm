[project]
name = "forecast-tfm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "dataframe-image>=0.2.7",
    "duckdb>=1.5.3",
    "humanize>=4.16.0",
    "ipykernel>=7.3.0",
    "ipython>=9.14.1",
    "ipywidgets>=8.1.8",
    "kaggle>=2.2.4",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "marimo[sql]>=0.23.16",
    "matplotlib>=3.11.0",
    "matplotlib-inline>=0.2.2",
    "mlforecast>=1.0.2",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "optuna-integration>=4.9.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars[pyarrow,rtcompat]>=1.41.2",
    "prophet>=1.4.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsforecast>=0.7.1",
    "statsmodels>=0.14.6",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]
